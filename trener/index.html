<style>

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}

/* top bars */
.top{display:flex;align-items:center;gap:12px;padding:18px 0 14px}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.logo{width:46px;height:46px;border-radius:14px;background:var(--pri);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 12px rgba(31,79,203,.3)}
.logo svg{width:26px;height:26px}
.brand h1{font-size:20px;line-height:1.2;letter-spacing:-.01em}
.brand p{font-size:14px;color:var(--muted)}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);flex:none}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;margin:0 -16px;padding:10px 16px;background:rgba(242,244,249,.94);backdrop-filter:blur(8px)}
.bar .t{flex:1;min-width:0;font-weight:650;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-btn{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:15px;font-weight:600;color:var(--muted)}
.chip-btn.on{background:var(--pri-soft);color:var(--pri);box-shadow:none}
.chip-btn svg.i{width:18px;height:18px}

/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.ready{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;letter-spacing:-.02em}
.ready h2{font-size:17px;margin-bottom:8px}
.mini{display:grid;gap:7px;flex:1;min-width:0}
.mini div{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px;color:var(--muted)}
.mini i{grid-column:1/-1;height:6px;border-radius:9px;background:var(--line);overflow:hidden;display:block}
.mini i span{display:block;height:100%;border-radius:9px}

.cta{width:100%;margin-top:14px;display:flex;align-items:center;gap:14px;text-align:left;background:var(--pri);color:var(--pri-ink);border-radius:var(--r);padding:16px 18px;box-shadow:0 6px 18px rgba(31,79,203,.28)}
.cta .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.cta b{display:block;font-size:18px}
.cta small{display:block;font-size:14px;opacity:.85;margin-top:1px}
.cta.alt{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.cta.alt .ic{background:var(--warn-soft);color:var(--warn)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;min-height:96px;position:relative}
.tile .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.tile b{font-size:15px;line-height:1.25}
.badge{position:absolute;top:12px;right:12px;min-width:26px;height:26px;padding:0 7px;border-radius:99px;background:var(--bad);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}

h2.sh{font-size:19px;margin:24px 2px 10px;letter-spacing:-.01em}
.secbox{margin-top:12px;padding:6px 0 4px}
.secbox h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;margin:0 14px 2px}
.topic{width:100%;display:flex;align-items:center;gap:12px;padding:11px 14px;text-align:left}
.topic+.topic{border-top:1px solid var(--line)}
.topic .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.topic .tx{flex:1;min-width:0}
.topic b{display:block;font-size:16px;font-weight:600}
.topic small{display:block;font-size:13px;color:var(--muted)}
.topic .bar2{height:5px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}
.topic .bar2 span{display:block;height:100%;border-radius:9px}
.topic .chev{color:#A3ABBF}

.exams{display:grid;gap:8px}
.exrow{display:flex;align-items:center;gap:12px;font-size:15px}
.exrow .sc{font-weight:700;width:58px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.appbanner{display:flex;align-items:center;gap:14px;margin-top:14px;text-decoration:none;color:inherit}
.appbanner .ic{width:44px;height:44px;border-radius:12px;background:var(--pri);color:#fff;display:grid;place-items:center;flex:none}
.appbanner span{flex:1;min-width:0}.appbanner .ic{flex:none}
.appbanner b{display:block;font-size:16px}.appbanner small{display:block;font-size:13px;color:var(--muted)}
.appbanner .chev{color:#A3ABBF}
.disc{font-size:13px;color:var(--muted);text-align:center;margin:26px 10px 0;line-height:1.4}

/* language screen */
.lang{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:24px 4px}
.lang .logo{width:72px;height:72px;border-radius:22px;margin:0 auto}
.lang .logo svg{width:40px;height:40px}
.lang h1{text-align:center;font-size:24px;letter-spacing:-.02em}
.lang p{text-align:center;color:var(--muted);font-size:15px;margin-top:-12px}
.langs{display:grid;gap:10px}
.lbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 18px;font-size:19px;font-weight:650;text-align:left}
.lbtn small{font-size:14px;font-weight:500;color:var(--muted)}
.lbtn.on{outline:2.5px solid var(--pri)}

/* quiz */
.prog{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:2px 0 14px}
.prog span{display:block;height:100%;background:var(--pri);border-radius:9px;transition:width .25s}
.qmeta{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.qmeta .dot{width:8px;height:8px;border-radius:9px}
.instr{font-size:15px;color:var(--muted);margin-bottom:10px}
.qtext{font-size:21px;line-height:1.35;font-weight:650;letter-spacing:-.01em;margin:4px 0 6px}
.qtr{font-size:15px;color:var(--muted);background:var(--soft);border-left:3px solid #C9D3EC;border-radius:8px;padding:8px 10px;margin:8px 0 4px}
.blank{display:inline-block;min-width:76px;border-bottom:2.5px solid var(--pri);margin:0 3px;transform:translateY(-3px)}
.filled{color:var(--pri);border-bottom:2.5px solid currentColor;padding:0 2px}
.sign{background:#FFFDF2;border:2px solid #E9DFB5;border-radius:14px;padding:16px;text-align:center;font-size:18px;font-weight:650;line-height:1.35;margin:4px 0 12px;white-space:pre-line}
.ptext{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;font-size:17px;line-height:1.5;margin:4px 0 12px;white-space:pre-line}
.form{background:#fff;border:1.5px dashed #B9C3DB;border-radius:14px;padding:14px 16px;margin:4px 0 12px;font-size:17px;white-space:pre-line;line-height:1.6}
.form b{display:block;text-align:center;letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--muted);margin-bottom:4px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px 14px;border:2px solid transparent;min-height:58px;transition:transform .08s}
.opt:active{transform:scale(.985)}
.opt .n{width:28px;height:28px;border-radius:99px;background:var(--soft);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--muted);flex:none;margin-top:1px}
.opt .ot{flex:1;min-width:0;font-size:17px;font-weight:550}
.opt .ot small{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:2px}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.sel .n{background:var(--pri);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .n{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .n{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opts.flags{grid-template-columns:repeat(3,1fr)}
.opt.flag{flex-direction:column;align-items:center;padding:10px}
.opt.flag svg{width:100%;height:auto;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.answer{margin-top:14px}
.inp{width:100%;height:56px;border-radius:14px;border:2px solid var(--line);background:#fff;padding:0 16px;font-size:19px;outline:none}
.inp:focus{border-color:var(--pri)}
.inp.ok{border-color:var(--ok);background:var(--ok-soft)} .inp.bad{border-color:var(--bad);background:var(--bad-soft)}

.fb{margin-top:16px;border-radius:14px;padding:14px 16px;font-size:16px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb .h{display:flex;align-items:center;gap:8px;font-weight:750;font-size:18px}
.fb.ok .h{color:var(--ok)} .fb.bad .h{color:var(--bad)}
.fb .ra{margin-top:4px}
.fb .ex{margin-top:8px;line-height:1.45}
.fb .ex.tr{color:var(--muted);font-size:15px;border-top:1px solid rgba(0,0,0,.07);padding-top:8px}

.audio{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin:4px 0 12px}
.play{width:62px;height:62px;border-radius:99px;background:var(--pri);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 16px rgba(31,79,203,.3)}
.play svg{width:26px;height:26px;fill:#fff;stroke:none}
.play:disabled{background:#B7C0D6;box-shadow:none}
.audio .at{flex:1;min-width:0}
.audio .at b{display:block;font-size:17px}
.audio .at small{display:block;font-size:14px;color:var(--muted)}
.audio.playing .play{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,79,203,.45)}100%{box-shadow:0 0 0 16px rgba(31,79,203,0)}}
.waves{display:flex;gap:3px;align-items:center;height:22px;margin-top:4px}
.waves i{width:4px;height:6px;border-radius:3px;background:#C9D3EC}
.audio.playing .waves i{background:var(--pri);animation:wave 0.9s infinite ease-in-out}
.audio.playing .waves i:nth-child(2){animation-delay:.1s}.audio.playing .waves i:nth-child(3){animation-delay:.2s}.audio.playing .waves i:nth-child(4){animation-delay:.3s}.audio.playing .waves i:nth-child(5){animation-delay:.4s}.audio.playing .waves i:nth-child(6){animation-delay:.5s}
@keyframes wave{0%,100%{height:6px}50%{height:20px}}
.slow{height:34px;padding:0 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--soft);color:var(--muted)}
.slow.on{background:var(--pri-soft);color:var(--pri)}
.warnbox{background:var(--warn-soft);color:#6E4300;border-radius:14px;padding:12px 14px;font-size:15px;margin:4px 0 12px}
.warnbox button{margin-top:8px;font-weight:700;color:var(--warn)}

.linkbtn{margin-top:10px;font-weight:700;color:var(--pri);font-size:15px;display:inline-flex;align-items:center;gap:6px}

.bottom{position:sticky;bottom:0;margin:18px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(242,244,249,0),var(--bg) 30%)}
.btn{width:100%;height:56px;border-radius:16px;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--pri);color:#fff;box-shadow:0 6px 16px rgba(31,79,203,.28)}
.btn.pri:disabled{background:#B7C0D6;box-shadow:none}
.btn.sec{background:var(--card);box-shadow:var(--shadow)}

/* exam */
.timer{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:750;font-size:16px;background:var(--card);box-shadow:var(--shadow);height:38px;padding:0 12px;border-radius:99px}
.timer.low{color:var(--bad)}
.nums{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px;scrollbar-width:none}
.nums::-webkit-scrollbar{display:none}
.num{flex:none;width:36px;height:36px;border-radius:10px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:700;color:var(--muted)}
.num.done{background:var(--pri-soft);color:var(--pri);box-shadow:none}
.num.cur{background:var(--pri);color:#fff}
.intro ul{margin:10px 0 0;padding-left:20px}
.intro li{margin:6px 0}

/* results */
.res{text-align:center;padding:24px 16px}
.res .big{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
.res .big small{font-size:24px;color:var(--muted);font-weight:700}
.res .st{display:inline-flex;align-items:center;gap:8px;margin-top:12px;font-weight:750;font-size:18px;padding:8px 16px;border-radius:99px}
.res.pass .st{background:var(--ok-soft);color:var(--ok)} .res.fail .st{background:var(--bad-soft);color:var(--bad)}
.reqs{display:grid;gap:2px;margin-top:12px}
.req{display:flex;align-items:center;gap:10px;padding:10px 4px;font-size:15px}
.req+.req{border-top:1px solid var(--line)}
.req .ri{width:26px;height:26px;border-radius:99px;display:grid;place-items:center;flex:none}
.req .ri svg{width:16px;height:16px;stroke-width:3}
.req.ok .ri{background:var(--ok-soft);color:var(--ok)} .req.bad .ri{background:var(--bad-soft);color:var(--bad)}
.req span{flex:1}
.req b{font-variant-numeric:tabular-nums}
.rv{padding:12px 14px}
.rv+.rv{border-top:1px solid var(--line)}
.rv .rh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.rv .rh .ri{width:22px;height:22px;border-radius:99px;display:grid;place-items:center}
.rv .rh .ri svg{width:14px;height:14px;stroke-width:3}
.rv.ok .ri{background:var(--ok-soft);color:var(--ok)} .rv.bad .ri{background:var(--bad-soft);color:var(--bad)}
.rv .rq{font-weight:600;margin-top:4px}
.rv .ra{font-size:15px;margin-top:4px}
.rv .ra .y{color:var(--bad)} .rv .ra .c{color:var(--ok);font-weight:650}
.rv .re{font-size:14px;color:var(--muted);margin-top:4px}
.done{text-align:center;padding:40px 8px 8px}
.done .big{font-size:56px;font-weight:800;letter-spacing:-.03em}
.done p{font-size:18px;color:var(--muted);margin:6px 0 26px}
.done .btn+.btn{margin-top:10px}

/* settings / info */
.set h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{height:48px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-weight:650;font-size:15px}
.seg button.on{background:var(--pri);color:#fff}
.info h3{font-size:17px;margin:18px 0 6px}
.info p,.info li{font-size:16px;line-height:1.5}
.info ul{margin:6px 0;padding-left:20px}
.info table{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
.info td{padding:8px 4px;border-top:1px solid var(--line)}
.info td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.info .tr{color:var(--muted);font-size:15px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,16,32,.45);display:grid;place-items:end center;z-index:50;padding:16px}
.modal .box{width:100%;max-width:520px;background:var(--card);border-radius:22px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25);margin-bottom:env(safe-area-inset-bottom)}
.modal p{font-size:18px;font-weight:650;margin-bottom:16px;line-height:1.35}
.modal .btns2 .btn{height:52px}
.danger{color:var(--bad)}
.fade{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>

const TTS = (() => {
  const nat = window.AndroidTTS;
  let seq = 0, cb = null, active = false;
  const clean = s => s.replace(/^[\s–—-]+/, '').trim();
  function status() {
    if (nat) { try { return nat.status(); } catch (e) { return 'none'; } }
    return 'speechSynthesis' in window ? 'ok' : 'none';
  }
  function play(lines, dialog, onEnd) {
    stop(); active = true; cb = onEnd; const my = ++seq;
    const parts = lines.map((l, i) => ({ t: clean(l), p: dialog ? (i % 2 ? 0.8 : 1.12) : 1 }));
    if (nat) { try { nat.speak(JSON.stringify(parts), S.rate, String(my)); } catch (e) { finish(my); } return; }
    if (!('speechSynthesis' in window)) { finish(my); return; }
    const v = speechSynthesis.getVoices().find(x => /^ru/i.test(x.lang));
    let i = 0;
    const next = () => {
      if (my !== seq) return;
      if (i >= parts.length) { finish(my); return; }
      const u = new SpeechSynthesisUtterance(parts[i].t);
      u.lang = 'ru-RU'; if (v) u.voice = v; u.rate = 0.92 * S.rate; u.pitch = parts[i].p; i++;
      u.onend = () => setTimeout(next, 500); u.onerror = () => finish(my);
      speechSynthesis.speak(u);
    };
    next();
  }
  function finish(id) { if (String(id) !== String(seq)) return; active = false; const f = cb; cb = null; if (f) f(); }
  function stop() { seq++; active = false; cb = null; if (nat) { try { nat.stop(); } catch (e) { /* */ } } else if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  window.__ttsDone = id => finish(id);
  if ('speechSynthesis' in window) speechSynthesis.getVoices();
  return { play, stop, status, get active() { return active; } };
})();

/* ---------------- sessions ---------------- */
function buildTrain(tp, onlyMistakes) {
  let pool = onlyMistakes ? mistakes() : itemsOfTopic(tp);
  const rank = it => { const r = S.st[it.id]; return !r ? 0 : r.l === 0 ? 1 : 2 + (r.c > 2 ? 1 : 0); };
  if (!onlyMistakes && tp.id === 'listen') {             // keep the 2 questions of one recording together
    const groups = {}; pool.forEach(it => (groups[it.g.id] = groups[it.g.id] || []).push(it));
    const gl = shuffle(Object.values(groups)).sort((a, b) => Math.min(...a.map(rank)) - Math.min(...b.map(rank)));
    return gl.slice(0, 5).flat().map(it => it.id);
  }
  pool = shuffle(pool).sort((a, b) => rank(a) - rank(b) || (S.st[a.id] ? S.st[a.id].d : 0) - (S.st[b.id] ? S.st[b.id].d : 0));
  return pool.slice(0, 10).sort((a, b) => onlyMistakes ? a.t - b.t : 0).map(it => it.id);
}
function startTrain(topicId, onlyMistakes) {
  const tp = TOPICS.find(t => t.id === topicId);
  const ids = buildTrain(tp, onlyMistakes);
  if (!ids.length) return;
  go('quiz', { topic: topicId, mist: !!onlyMistakes, ids, i: 0, res: {}, ord: {} }, view.name === 'trainDone');
}
function buildExam() {
  const ids = [];
  const d = pick(LB.filter(g => g.t === 1)), a = pick(LB.filter(g => g.t === 3));
  ids.push(d.id + '-1', d.id + '-2', a.id + '-1', a.id + '-2');
  for (let t = 5; t <= 22; t++) {
    if (t === 15) continue;
    if (t === 14) { const two = shuffle(BY_T[14]).slice(0, 2); ids.push(two[0].id, two[1].id); continue; }
    ids.push(pick(BY_T[t]).id);
  }
  const ord = {}; ids.forEach(id => { if (ITEMS[id].kind === 'mc') ord[id] = orderFor(ITEMS[id]); });
  return { ids, ans: {}, ord, plays: {}, start: Date.now(), i: 0 };
}
function slotTask(i) { return i + 1; }          // exam slot index -> task number 1..22
function examLeft(ex) { return EXAM_SEC - (Date.now() - ex.start) / 1000; }
function scoreExam(ex) {
  const pts = { ru: 0, listen: 0, hist: 0, law: 0 }; let total = 0;
  const rows = ex.ids.map((id, i) => {
    const it = ITEMS[id], v = ex.ans[id];
    const ok = v != null && (it.kind === 'input' ? checkInput(it, v) : v === it.a);
    if (ok) { total++; pts[secOf(slotTask(i))]++; if (slotTask(i) <= 4) pts.listen++; }
    return { id, ok, v };
  });
  const reqs = [
    ['reqTotal', total, 11, 22], ['reqRu', pts.ru, 6, 11], ['reqListen', pts.listen, 2, 4], ['reqHist', pts.hist, 2, 5], ['reqLaw', pts.law, 3, 6]
  ].map(([k, v, min, max]) => ({ k, v, min, max, ok: v >= min }));
  return { total, pts, rows, reqs, pass: reqs.every(r => r.ok) };
}
function finishExam() {
  const ex = S.cur; if (!ex) return;
  TTS.stop();
  const sc = scoreExam(ex);
  sc.rows.forEach(r => mark(r.id, r.ok));
  const rec = { d: Date.now(), s: sc.total, p: sc.pass, ids: ex.ids, ans: ex.ans };
  S.exams.unshift(rec); S.exams = S.exams.slice(0, 20); S.cur = null; save();
  stack.length = 0; view = { name: 'home' };
  go('examResult', { rec });
}

  const r = readiness(), C = 2 * Math.PI * 40;
  const mist = mistakes().length;
  const mini = SECS.map(s => { const p = Math.round(secReady(s.id) * 100); return `<div><span>${esc(T(s.key))}</span><b>${p}%</b><i><span style="width:${p}%;background:${s.color}"></span></i></div>`; }).join('');
  const secs = SECS.map(s => `<div class="card secbox"><h3 style="color:${s.color}">${esc(T(s.key))}</h3>${TOPICS.filter(tp => tp.sec === s.id).map(tp => {
    const all = itemsOfTopic(tp), k = all.filter(it => known(it.id)).length, p = all.length ? Math.round(k / all.length * 100) : 0;
    return `<button class="topic" data-act="train" data-arg="${tp.id}"><span class="ic" style="background:${s.soft};color:${s.color}">${ic(tp.icon)}</span><span class="tx"><b>${esc(T('tp_' + tp.id))}</b><small>${esc(T('learned', { k, n: all.length }))}</small><span class="bar2"><span style="width:${p}%;background:${s.color}"></span></span></span>${ic('chev', 'chev')}</button>`;
  }).join('')}</div>`).join('');
  const exams = S.exams.slice(0, 5).map((e, i) => `<button class="exrow" data-act="oldExam" data-arg="${i}"><span class="sc">${e.s}/22</span><span class="pill ${e.p ? 'ok' : 'bad'}">${esc(e.p ? T('passedShort') : T('failedShort'))}</span><span class="muted" style="flex:1;text-align:right">${fmtDate(e.d)}</span></button>`).join('');
  return `<div>
  <header class="top"><div class="brand"><div class="logo">${ic('logo')}</div><div><h1>${esc(T('appName'))}</h1><p>${esc(T('appSub'))}</p></div></div><button class="icon-btn" data-act="go" data-arg="settings" aria-label="${esc(T('settings'))}">${ic('settings')}</button></header>
  <section class="card ready"><div class="ring"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" stroke="#E1E5EF" stroke-width="10" fill="none"/><circle cx="48" cy="48" r="40" stroke="var(--pri)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - r)}"/></svg><b>${Math.round(r * 100)}%</b></div>
    <div class="mini"><h2>${esc(T('readiness'))}</h2>${mini}</div></section>
  ${S.cur ? `<button class="cta alt" data-act="contExam"><span class="ic">${ic('timer')}</span><span><b>${esc(T('continueExam'))}</b><small>${esc(T('timeLeft'))}: ${fmtTime(examLeft(S.cur))}</small></span></button>` : ''}
  <button class="cta" data-act="go" data-arg="examIntro"><span class="ic">${ic('exam')}</span><span><b>${esc(T('startExam'))}</b><small>${esc(T('examSub'))}</small></span></button>
  <div class="row2">
    <button class="tile" data-act="mistakes"><span class="ic" style="background:var(--bad-soft);color:var(--bad)">${ic('redo')}</span><b>${esc(T('mistakes'))}</b>${mist ? `<span class="badge">${mist}</span>` : ''}</button>
    <button class="tile" data-act="go" data-arg="info"><span class="ic" style="background:var(--pri-soft);color:var(--pri)">${ic('info')}</span><b>${esc(T('about'))}</b></button>
  </div>
  <h2 class="sh">${esc(T('train'))}</h2>
  ${secs}
  ${exams ? `<h2 class="sh">${esc(T('lastExams'))}</h2><div class="card exams">${exams}</div>` : ''}
  ${window.SITE && window.SITE.rustore ? `<a class="card appbanner" href="${esc(window.SITE.rustore)}" target="_blank" rel="noopener"><span class="ic">${ic('logo')}</span><span><b>${esc(T('getApp'))}</b><small>${esc(T('getAppSub'))}</small></span>${ic('chev', 'chev')}</a>` : ''}
  <p class="disc">${esc(T('disclaimer'))}</p>
</div>`;
};
function finishExamSilently() {
  const ex = S.cur; const sc = scoreExam(ex); sc.rows.forEach(r => mark(r.id, r.ok));
  S.exams.unshift({ d: Date.now(), s: sc.total, p: sc.pass, ids: ex.ids, ans: ex.ans }); S.exams = S.exams.slice(0, 20); S.cur = null; save();
}

SCREENS.quiz = () => {
  const v = view, id = v.ids[v.i], it = ITEMS[id];
  if (!v.ord[id]) v.ord[id] = it.kind === 'mc' ? orderFor(it) : [];
  const r = v.res[id], revealed = r != null;
  const tp = TOPICS.find(t => t.id === v.topic), sec = SEC(secOf(it.t));
  const title = v.mist ? T('mistakes') : T('tp_' + tp.id);
  const canTr = lang() !== 'ru';
  return `<div>
  <div class="bar"><button class="icon-btn" data-act="back" aria-label="${esc(T('back'))}">${ic('back')}</button><div class="t">${esc(title)}</div>${canTr ? `<button class="chip-btn ${S.tr ? 'on' : ''}" data-act="toggleTr">${ic('globe')}${esc(T('translate'))}</button>` : ''}</div>
  <div class="prog"><span style="width:${(v.i + (revealed ? 1 : 0)) / v.ids.length * 100}%"></span></div>
  <div class="qmeta"><span class="dot" style="background:${sec.color}"></span>${esc(T('task'))} ${it.t} · ${v.i + 1} / ${v.ids.length}</div>
  ${questionHTML(it, { exam: false, chosen: revealed ? r.v : null, revealed, ord: v.ord[id], showTr: S.tr && canTr })}
  ${revealed ? feedbackHTML(it, r.v, S.tr) : ''}
  <div class="bottom">${revealed ? `<button class="btn pri" data-act="next">${esc(v.i + 1 < v.ids.length ? T('next') : T('finish'))}${ic('chev')}</button>`
    : it.kind === 'input' ? `<button class="btn pri" data-act="checkInput">${esc(T('check'))}</button>` : ''}</div>
</div>`;
};

SCREENS.trainDone = () => {
  const v = view, ok = v.ids.filter(id => v.res[id] && v.res[id].ok).length;
  return `<div><div class="bar"><button class="icon-btn" data-act="home">${ic('back')}</button><div class="t">${esc(v.mist ? T('mistakes') : T('tp_' + v.topic))}</div></div>
  <div class="done"><div class="big">${ok} / ${v.ids.length}</div><p>${esc(T('sessionDone'))}</p>
  ${!v.mist || mistakes().length ? `<button class="btn pri" data-act="more">${esc(v.mist ? T('againMistakes') : T('more'))}</button>` : ''}
  <button class="btn sec" data-act="home">${esc(T('toHome'))}</button></div></div>`;
};

SCREENS.examIntro = () => `<div>
  <div class="bar"><button class="icon-btn" data-act="back">${ic('back')}</button><div class="t">${esc(T('startExam'))}</div></div>
  <div class="card intro"><h2 style="font-size:20px">${esc(T('examIntroTitle'))}</h2>
    <ul>${['ei1', 'ei2', 'ei3', 'ei4', 'ei5'].map(k => `<li>${esc(T(k))}</li>`).join('')}</ul></div>
  <div class="bottom"><button class="btn pri" data-act="startExam">${esc(T('begin'))}</button></div>
</div>`;

SCREENS.exam = () => {
  const ex = S.cur; if (!ex) return SCREENS.home();
  const i = ex.i, id = ex.ids[i], it = ITEMS[id], left = examLeft(ex);
  const nums = ex.ids.map((x, k) => `<button class="num ${k === i ? 'cur' : ex.ans[x] != null && ex.ans[x] !== '' ? 'done' : ''}" data-act="jump" data-arg="${k}">${k + 1}</button>`).join('');
  return `<div>
  <div class="bar"><button class="icon-btn" data-act="back">${ic('back')}</button><div class="t">${esc(T('task'))} ${i + 1} / 22</div><div class="timer ${left < 300 ? 'low' : ''}" id="timer">${ic('timer')}<span>${fmtTime(left)}</span></div></div>
  <div class="nums" id="nums">${nums}</div>
  ${questionHTML(it, { exam: true, chosen: ex.ans[id], revealed: false, ord: ex.ord[id] || [], showTr: false })}
  <div class="bottom"><div class="btns2">
    <button class="btn sec" data-act="examPrev" ${i === 0 ? 'disabled style="opacity:.4"' : ''}>${esc(T('prev'))}</button>
    ${i < 21 ? `<button class="btn pri" data-act="examNext">${esc(T('next'))}</button>` : `<button class="btn pri" data-act="examFinish">${esc(T('finishExam'))}</button>`}
  </div>${i < 21 ? `<button class="linkbtn" style="width:100%;justify-content:center" data-act="examFinish">${esc(T('finishExam'))}</button>` : ''}</div>
</div>`;
};
function startTimer() {
  const el = document.querySelector('#timer span');
  const n = document.querySelector('.num.cur'); if (n) n.scrollIntoView({ block: 'nearest', inline: 'center' });
  timerId = setInterval(() => {
    if (!S.cur) return clearInterval(timerId);
    const left = examLeft(S.cur);
    if (el) { el.textContent = fmtTime(left); el.parentNode.classList.toggle('low', left < 300); }
    if (left <= 0) { clearInterval(timerId); finishExam(); }
  }, 1000);
}

SCREENS.examResult = () => {
  const rec = view.rec, ex = { ids: rec.ids, ans: rec.ans }, sc = scoreExam(ex);
  const reqs = sc.reqs.map(q => `<div class="req ${q.ok ? 'ok' : 'bad'}"><span class="ri">${ic(q.ok ? 'check' : 'x')}</span><span>${esc(T(q.k))}</span><b>${q.v} / ${q.max}</b></div>`).join('');
  const rows = sc.rows.map((r, i) => {
    const it = ITEMS[r.id]; const tr = TR(it);
    const your = r.v == null || r.v === '' ? T('noAnswer') : it.kind === 'input' ? r.v : (it.ru.o[r.v].startsWith('flag:') ? '🏳' : it.ru.o[r.v]);
    const right = it.kind === 'input' ? it.ans[0] : (it.ru.o[it.a].startsWith('flag:') ? T('flagRu') : it.ru.o[it.a]);
    const q = it.ru.q || (it.ru.x || '').split('\n')[0];
    return `<div class="rv ${r.ok ? 'ok' : 'bad'}"><div class="rh"><span class="ri">${ic(r.ok ? 'check' : 'x')}</span>${esc(T('task'))} ${i + 1}</div>
      <div class="rq">${blankify(q)}</div>
      ${r.ok ? `<div class="ra"><span class="c">${esc(right)}</span></div>` : `<div class="ra">${esc(T('yourAnswer'))}: <span class="y">${esc(your)}</span><br>${esc(T('rightAnswer'))}: <span class="c">${esc(right)}</span></div>
      ${it.ru.e ? `<div class="re">${esc(it.ru.e)}${tr && tr.e ? '<br>' + esc(tr.e) : ''}</div>` : ''}`}</div>`;
  }).join('');
  return `<div>
  <div class="bar"><button class="icon-btn" data-act="home">${ic('back')}</button><div class="t">${esc(T('results'))}</div></div>
  <div class="card res ${sc.pass ? 'pass' : 'fail'}"><div class="big">${sc.total}<small> / 22</small></div><div class="st">${ic(sc.pass ? 'check' : 'x')}${esc(sc.pass ? T('passed') : T('failed'))}</div>
    <div class="reqs" style="text-align:left">${reqs}</div></div>
  <div class="row2"><button class="btn sec" data-act="home">${esc(T('toHome'))}</button><button class="btn pri" data-act="go" data-arg="examIntro">${esc(T('again'))}</button></div>
  <h2 class="sh">${esc(T('review'))}</h2><div class="card" style="padding:4px 0">${rows}</div>
</div>`;
};

SCREENS.settings = () => `<div class="set">
  <div class="bar"><button class="icon-btn" data-act="back">${ic('back')}</button><div class="t">${esc(T('settings'))}</div></div>
  <h3>${esc(T('language'))}</h3><div class="langs">${LANGS.map(([id, name, sub]) => `<button class="lbtn ${S.lang === id ? 'on' : ''}" data-act="setLang" data-arg="${id}" style="padding:14px 16px;font-size:17px"><span>${name}</span><small>${sub}</small></button>`).join('')}</div>
  ${lang() !== 'ru' ? `<h3>${esc(T('translate'))}</h3><div class="seg"><button class="${S.tr ? 'on' : ''}" data-act="setTr" data-arg="1">${esc(T('on'))}</button><button class="${!S.tr ? 'on' : ''}" data-act="setTr" data-arg="0">${esc(T('off'))}</button></div>` : ''}
  <h3>${esc(T('speechRate'))}</h3><div class="seg"><button class="${S.rate >= 1 ? 'on' : ''}" data-act="setRate" data-arg="1">${esc(T('normal'))}</button><button class="${S.rate < 1 ? 'on' : ''}" data-act="setRate" data-arg="0.75">${esc(T('slow'))}</button></div>
  <h3>${esc(T('progress'))}</h3><button class="btn sec danger" data-act="reset">${esc(T('reset'))}</button>
  <p class="disc">${esc(T('disclaimer'))}<br>${esc(T('offline'))}<br>v1.0</p>
</div>`;

SCREENS.info = () => {
  const cyrHtml = h => h.split(/(<[^>]+>)/).map(p => p.startsWith('<') ? p : toCyr(p)).join('');
  const l = lang(), src = (l === 'uzc' ? UI.uz.info.map(([h, b]) => [toCyr(h), cyrHtml(b)]) : (UI[l] && UI[l].info)) || UI.ru.info;
  const ru = UI.ru.info;
  return `<div class="info">
  <div class="bar"><button class="icon-btn" data-act="back">${ic('back')}</button><div class="t">${esc(T('about'))}</div></div>
  <div class="card">${src.map(([h, body]) => `<h3>${esc(h)}</h3>${body}`).join('')}</div>
  ${l !== 'ru' ? `<h2 class="sh">Русский язык</h2><div class="card">${ru.map(([h, body]) => `<h3>${esc(h)}</h3>${body}`).join('')}</div>` : ''}
  <p class="disc">${esc(T('disclaimer'))}</p>
</div>`;
};

/* ---------------- actions ---------------- */
const A = {};
A.go = arg => go(arg);
A.back = () => back();
A.home = () => home();
A.mClose = () => closeModal();
A.mYes = () => { const m = document.getElementById('modal'); const f = m && m._yes; closeModal(); if (f) f(); };
A.setLang = arg => { const first = !S.lang; S.lang = arg; save(); document.documentElement.lang = arg === 'tg' ? 'tg' : arg.startsWith('uz') ? 'uz' : 'ru'; if (first) { view = { name: 'home' }; render(true); applyHash(); } else render(false); };
A.setTr = arg => { S.tr = arg === '1'; save(); render(false); };
A.toggleTr = () => { S.tr = !S.tr; save(); render(false); };
A.setRate = arg => { S.rate = +arg; save(); render(false); };
A.slow = () => { S.rate = S.rate < 1 ? 1 : 0.75; save(); const b = document.querySelector('.slow'); if (b) b.classList.toggle('on', S.rate < 1); };
A.reset = () => modal(T('resetConfirm'), T('reset'), T('no'), () => { const l = S.lang; S = defState(); S.lang = l; save(); home(); }, true);
A.train = arg => startTrain(arg);
A.mistakes = () => { if (!mistakes().length) { modal(T('noMistakes'), 'OK', T('back'), () => { }); return; } startTrain('listen', true); };
A.more = () => startTrain(view.topic, view.mist);
A.choose = (arg) => {
  const oi = +arg;
  if (view.name === 'quiz') {
    const id = view.ids[view.i], it = ITEMS[id];
    if (view.res[id]) return;
    const ok = oi === it.a; view.res[id] = { v: oi, ok }; mark(id, ok); save();
    TTS.stop(); render(false);
    const fb = document.querySelector('.fb'); if (fb) setTimeout(() => fb.scrollIntoView({ behavior: 'smooth', block: 'center' }), 30);
  } else if (view.name === 'exam') {
    const ex = S.cur, id = ex.ids[ex.i]; ex.ans[id] = oi; save();
    document.querySelectorAll('.opt').forEach(b => b.classList.toggle('sel', +b.dataset.arg === oi));
    const n = document.querySelectorAll('.num')[ex.i]; if (n) n.classList.add('done');
  }
};
A.checkInput = () => {
  const inp = document.getElementById('inp'); if (!inp || !inp.value.trim()) { inp && inp.focus(); return; }
  const id = view.ids[view.i], it = ITEMS[id], ok = checkInput(it, inp.value);
  view.res[id] = { v: inp.value.trim(), ok }; mark(id, ok); save(); render(false);
};
A.next = () => {
  TTS.stop();
  if (view.i + 1 < view.ids.length) { view.i++; render(true); }
  else { view = Object.assign({}, view, { name: 'trainDone' }); render(true); }
};
A.play = () => {
  const box = document.getElementById('audio'); if (!box) return;
  const it = view.name === 'exam' ? ITEMS[S.cur.ids[S.cur.i]] : ITEMS[view.ids[view.i]];
  if (TTS.active) { TTS.stop(); box.classList.remove('playing'); box.querySelector('.play').innerHTML = PLAY; return; }
  if (view.name === 'exam') {
    const p = S.cur.plays[it.g.id] || 0; if (p >= 2) return;
    S.cur.plays[it.g.id] = p + 1; save();
    const sm = box.querySelector('small'); if (sm) sm.textContent = T('plays', { n: p + 1, m: 2 });
  }
  box.classList.add('playing'); box.querySelector('.play').innerHTML = STOP;
  TTS.play(it.g.ru, it.g.t === 1, () => {
    const b = document.getElementById('audio'); if (!b) return;
    b.classList.remove('playing'); const btn = b.querySelector('.play'); btn.innerHTML = PLAY;
    if (view.name === 'exam' && (S.cur.plays[it.g.id] || 0) >= 2) btn.disabled = true;
  });
};
A.script = () => { const el = document.getElementById('scr'); const it = ITEMS[view.ids[view.i]]; if (el) el.innerHTML = el.innerHTML ? '' : scriptBox(it); };
A.ttsSettings = () => { try { window.AndroidTTS.openSettings(); } catch (e) { /* */ } };
A.startExam = () => { S.cur = buildExam(); save(); stack.length = 0; view = { name: 'home' }; go('exam'); };
A.contExam = () => go('exam');
A.jump = arg => { saveInput(); S.cur.i = +arg; save(); TTS.stop(); render(true); };
A.examPrev = () => { if (S.cur.i > 0) A.jump(S.cur.i - 1); };
A.examNext = () => { if (S.cur.i < 21) A.jump(S.cur.i + 1); };
A.examFinish = () => {
  saveInput();
  const n = S.cur.ids.filter(id => S.cur.ans[id] != null && S.cur.ans[id] !== '').length;
  modal(T('finishConfirm', { a: n }), T('finish'), T('no'), finishExam);
};
A.oldExam = arg => go('examResult', { rec: S.exams[+arg] });
function saveInput() {
  if (view.name !== 'exam' || !S.cur) return;
  const inp = document.getElementById('inp'); if (inp) { S.cur.ans[S.cur.ids[S.cur.i]] = inp.value.trim(); save(); }
}

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) f(el.dataset.arg, el, e);
});
document.body.addEventListener('click', e => {             // buttons of the confirm dialog (it lives outside #app)
  const el = e.target.closest('#modal [data-act]'); if (el && A[el.dataset.act]) A[el.dataset.act](el.dataset.arg, el, e);
});
app.addEventListener('input', e => {
  if (e.target.id === 'inp' && view.name === 'exam' && S.cur) {
    S.cur.ans[S.cur.ids[S.cur.i]] = e.target.value.trim(); save();
    const n = document.querySelectorAll('.num')[S.cur.i]; if (n) n.classList.toggle('done', !!e.target.value.trim());
  }
});
app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'inp' && view.name === 'quiz') A.checkInput(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { saveInput(); TTS.stop(); } });

// Сайт может открыть тренажёр сразу на нужном месте: #exam — пробный экзамен, #t-<тема> — тренировка по теме.
function applyHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h || !S.lang) return;
  history.replaceState(null, '', location.pathname + location.search);
  if (h === 'exam') go('examIntro');
  else if (h.startsWith('t-') && TOPICS.some(t => t.id === h.slice(2))) startTrain(h.slice(2));
}
if (S.lang) document.documentElement.lang = S.lang === 'tg' ? 'tg' : S.lang.startsWith('uz') ? 'uz' : 'ru';
window.__app = { ITEMS, BY_T, S: () => S, go, home };
render(true);
applyHash();
})();

</script>
</body>
</html>
